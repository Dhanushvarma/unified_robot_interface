MainRobot: triorb
Enabled: TriOrbController
Timestep: 0.001

Default:
  control_mode: position   # velocity or torque [optional] default to position
  time_step: 0.001          # [optional] default to controller frequency (Hz)

Robots:
  triorb:
    module: triorb
    network_interface:
      protocol: zenoh
    robot_interface:
      driver: RobotDriverTriOrb
      ip: /dev/ttyACM0
      port: 0
      autostart: true
