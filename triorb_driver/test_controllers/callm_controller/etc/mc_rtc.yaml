MainRobot: UR5eFloatingBase
Enabled: CallMController
Timestep: 0.001

LogPolicy : threaded

# used to override system default for all robots
Default:
  control_mode: position
  time_step: 0.001
  network_interface: zenoh

Robots:
  ur5e:
    module: UR5eFloatingBase
    robot_interface:
      driver: RobotDriverRTDE
      ip: 150.18.227.205
      autostart: true
    network_interface:
      protocol: zenoh

  triorb:
    module: TriOrb
    robot_interface:
      driver: RobotDriverTriOrb
      ip: /dev/triorb
      # port: 0
      autostart: true
    network_interface:
      protocol: zenoh
