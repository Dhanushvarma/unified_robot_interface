MainRobot: OpenArmV2
Enabled: Posture
Timestep: 0.005

LogPolicy : threaded

ObserverPipelines:
  - name: OpenArmEncoder
    gui: true
    observers:
      - type: Encoder
        robot: openarm
        updateRobot: openarm

Robots:
  # panda1:
  #   module: panda_default
  #   init_pos: # [optional] default to all zeros
  #     translation: [0.70, 0.5, 0.0]
  #     rotation: [0.0, 0.0, 1.57]
  #   controller:
  #     mode: velocity
  #     time_step: 0.002
  #   network_interface:
  #     protocol: zenoh
  #   robot_interface:
  #     driver: RobotDriverRTDE
  #     ip: 192.168.1.2
  #     port: 30004        # RTDE port on UR controller
  #     control_mode: position

  # panda2:
  #   base: panda1
  #   init_pos:
  #     translation: [0.0, 1.5, 0.0]
  #   robot_interface:
  #     driver: RobotDriverRTDE
  #     ip: 192.168.1.3
  #     port: 30004

  # ur5e:
  #   module: UR5e            # mc_rtc RobotModule name (as installed by mc_ur5e)
  #   # interface: interface_template   # [optional] manager-side interface implementation, default to interface_template
  #   # protocol left unset: robot_interface.autostart below defaults it to zenoh/shm
  #   network_interface:
  #     protocol: zenoh
  #   robot_interface:
  #     driver: RobotDriverRTDE
  #     control_mode: position
  #     ip: 192.168.1.6
  #     # port: 0
  #     # Set to true when this robot is directly plugged into the control
  #     # computer (no separate robot-side PC): uri will spawn and
  #     # manage the `uri interface` process itself, so it no longer needs to
  #     # be started manually before running uri.
  #     autostart: true

  openarm:
    module: OpenArmV2          # mc_rtc RobotModule name (as installed by mc_openarm)
    network_interface:
      protocol: zenoh
    robot_interface:
      driver: RobotDriverROS2Control
      control_mode: position
      # Unused by this driver (topics/joints come from config_path below),
      # but required by RobotManager::processGConfig's validation.
      ip: 127.0.0.1
      port: 0
      # Driver-specific YAML, forwarded as-is to the driver's create()/constructor
      # (see ros2_control_driver/etc/openarm_bimanual.yaml).
      config_path: /home/tduvinage/devel/sandbox/ros2_control_driver/etc/openarm_bimanual.yaml
      # Co-located: no separate robot-side PC, controller_manager runs on
      # this same machine against the live sim.
      autostart: true

