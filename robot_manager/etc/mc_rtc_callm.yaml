MainRobot: UR5e
Enabled: CallMController
Timestep: 0.001

LogPolicy : threaded

Default:
  control_mode: position
  time_step: 0.001
  network_protocol: zenoh

Robots:
  triorb:
    module: triorb
    robot_interface:
      driver: RobotDriverTriOrb
      ip: /dev/triorb
      port: 0
      autostart: true
  ur5e:
    module: UR5e
    robot_interface:
      driver: RobotDriverRTDE
      ip: "localhost"
      port: 0
      autostart: true
