MainRobot: UR5e
Enabled: CallMController
Timestep: 0.001

LogPolicy : threaded

Robots:
  triorb:
    module: triorb
    robot_interface:
      driver: RobotDriverTriOrb
      ip: /dev/triorb
      port: 0
      autostart: true
  ur5e:
    module: UR5e
    robot_interface:
      driver: RobotDriverRTDE
      ip: "localhost"
      port: 0
      autostart: true
