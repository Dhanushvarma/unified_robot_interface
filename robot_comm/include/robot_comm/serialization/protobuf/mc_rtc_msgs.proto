syntax = "proto3";

package robot_comm_msgs_proto;

message MessageConfig {
  string config = 1;
}

message MessageBodySensor {
  string name = 1;
  repeated double orientation = 2;         // quaternion, (w, x, y, z)
  repeated double angular_velocity = 3;    // (x, y, z)
  repeated double linear_acceleration = 4; // (x, y, z)
}

message MessageForceSensor {
  string name = 1;
  repeated double force = 2;  // (x, y, z), sensor frame
  repeated double torque = 3; // (x, y, z), sensor frame
}

message MessageState {
  repeated double position = 1;
  repeated double velocity = 2;
  repeated double torque = 3;
  repeated MessageBodySensor body_sensors = 4;
  repeated MessageForceSensor force_sensors = 5;
  uint64 stamp = 6; // sender steady clock [ns], echoed in MessageCommand.state_stamp
}

message MessageCommand {
  double kp = 1;
  double kd = 2;

  repeated double position = 3;
  repeated double velocity = 4;
  repeated double torque = 5;
  uint64 state_stamp = 6; // MessageState.stamp of the latest state received
  uint64 state_hold = 7;  // [ns] that state was held before this command was sent
}

message MessageEnvelope {
  string topic = 1;
  uint64 timestamp = 2;

  oneof payload {
    MessageConfig config = 3;
    MessageState state = 4;
    MessageCommand command = 5;
  }
}
