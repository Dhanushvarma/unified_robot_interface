MainRobot: UR5e
Enabled: Posture
Timestep: 0.001

LogPolicy : threaded

# used to override system default for all robots
Default:
  module: default_module
  control_mode: position # velocity or torque [optional] default to POSITION
  driver: default_driver # [optional] default to driver defined in module
  time_step: 0.001       # [optional] default to controller frequency (Hz)
  network_protocol: tcp  # [optional] default to tcp

Robots:
  panda1:
    module: panda_default
    # visual: Sphere # TODO: what is this for ?
    init_pos: # [optional] default to all zeros
      translation: [0.70, 0.5, 0.0]
      rotation: [0.0, 0.0, 1.57]
    controller:
      mode: velocity
      driver: default
      time_step: 0.002
    network:
      protocol: tcp
      ip: 192.168.1.2
      port: 45000

  panda2:
    base: panda1
    init_pos:
      translation: [0.0, 1.5, 0.0]

  ur5e1:
    module: ur5e
    controller:
      driver: ur_rtde
    network:
      ip: "111.111.1.1"
      port: 10000 # TODO: default 00000

  ur5e2:
    base: ur5e1
    network:
      ip: "222.222.2.2"
