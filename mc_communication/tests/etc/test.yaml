Robots:
  robot1:
    module: jvrc1
    # ... other parameters
    network_interface:
      protocol: tcp
      ip: 192.168.1.2
      port: 45000

  robot2:
    module: jvrc1
    init_pos:
      translation: [0.0, 1.5, 0.0]

    network_interface:
      protocol: udp
      backend: flatbuffer
      ip: 192.168.0.1
      port: 100

    robot_interface:
      driver: RTDE
      ip: 127.0.0.1
      port: 3000
      control_mode: position # position, velocity, torque

  robot1_zenoh:
    module: jvrc1
    network_interface:
      protocol: zenoh/shm
      configuration: "/home/vscode/workspace/sandbox/fleet/mc_communication/tests/zenoh/client.json5"
      backend: flatbuffer
      ip: 192.168.0.1
      port: 100

  robot2_zenoh:
    module: jvrc1
    network_interface:
      protocol: zenoh/shm
      configuration: "/home/vscode/workspace/sandbox/fleet/mc_communication/tests/zenoh/client.json5"
      backend: flatbuffer
      ip: 192.168.0.1
      port: 100

  robot1_shm:
    module: jvrc1
    network_interface:
      protocol: shm
      backend: protobuf
      ip: 192.168.0.1
      port: 100

  robot2_shm:
    module: jvrc1
    network_interface:
      protocol: shm
      backend: flatbuffer
      ip: 192.168.0.1
      port: 100
